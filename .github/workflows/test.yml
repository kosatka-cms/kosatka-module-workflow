# The module's checks: vet and the unit tests; the tests on MySQL and
# PostgreSQL (the dbintegration tag); the migration files against the ent
# schema.
name: test

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: test
        ports: ["33306:3306"]
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -ptest"
          --health-interval 2s --health-retries 60
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: test
        ports: ["35432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-retries 60
    env:
      KOSATKA_TEST_MYSQL_DSN: root:test@tcp(127.0.0.1:33306)/?parseTime=true
      KOSATKA_TEST_POSTGRES_DSN: postgres://postgres:test@127.0.0.1:35432/postgres?sslmode=disable
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test ./...
      - run: go test -tags dbintegration ./...
      - run: go run ./cmd/migrations -check
